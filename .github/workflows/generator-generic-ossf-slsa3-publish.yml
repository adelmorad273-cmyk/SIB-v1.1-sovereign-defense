# ================================================================
# SIB v1.1 - SLSA v3 Generic Provenance Publisher
# ================================================================
# الغرض: بناء وتوقيع وإصدار مكونات SIB v1.1 مع شهادة SLSA v3
# البصمة التأسيسية: Adel Lakosha
# ================================================================

name: 🔐 SLSA v3 Generic Provenance Publisher

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  actions: read
  attestations: write

jobs:
  build-and-hash:
    name: 🛠️ Build & Hash Artifacts
    runs-on: ubuntu-24.04
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82
          targets: x86_64-unknown-linux-gnu

      - name: 📦 Build sib-node
        run: |
          cargo build --release --all-features
          test -f target/release/sib-node || (echo "❌ Build failed" && exit 1)
          echo "✅ Binary built"

      - name: 📂 Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/release/sib-node artifacts/
          cp README.md MANIFEST.md ARCHITECTURE.md artifacts/

      - name: 🔑 Generate SHA-256 (base64)
        id: hash
        run: |
          cd artifacts
          HASH_BIN=$(sha256sum sib-node | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          HASH_README=$(sha256sum README.md | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          HASH_MANIFEST=$(sha256sum MANIFEST.md | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          HASH_ARCH=$(sha256sum ARCHITECTURE.md | cut -d' ' -f1 | xxd -r -p | base64 -w0)
          SUBJECTS="sha256:$HASH_BIN,sha256:$HASH_README,sha256:$HASH_MANIFEST,sha256:$HASH_ARCH"
          echo "hashes=$SUBJECTS" >> $GITHUB_OUTPUT
          echo "🔑 Subjects: $SUBJECTS"

      - name: 📤 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sib-artifacts
          path: artifacts/
          retention-days: 1
          if-no-files-found: error

  generate-provenance:
    name: 📜 Generate SLSA v3 Provenance
    needs: [build-and-hash]
    permissions:
      actions: read
      id-token: write
      contents: write
      attestations: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.0.0
    with:
      base64-subjects: ${{ needs.build-and-hash.outputs.hashes }}
      upload-assets: true
      release-tag: ${{ github.event.release.tag_name }}

  post-verify:
    name: 🔍 Genesis Seal & Verification
    needs: [generate-provenance]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sib-artifacts
          path: downloaded/

      - name: 🔐 Verify SLSA
        run: |
          echo "==================================================="
          echo "🔐 SLSA v3 Provenance Verification Summary"
          echo "==================================================="
          echo "✅ Provenance generated successfully."
          echo "✅ Artifacts sealed with SHA-256 hashes."
          echo "✅ Release integrity secured."
          echo ""
          echo "👑 Genesis Architect: Adel Lakosha"
          echo "📅 Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "🔑 SIB v1.1 - Sovereign Immunity Blueprint"
          echo "==================================================="

      - name: 📜 Append Genesis Seal
        uses: actions/github-script@v7
        with:
          script: |
            const release_id = context.payload.release.id;
            const octokit = github.getOctokit(process.env.GITHUB_TOKEN);
            const seal = `
            ## 🏛️ البصمة التأسيسية (Genesis Seal)
            هذا الإصدار مُختوم رسمياً تحت بصمة **Adel Lakosha**، مُفجّر عصر الذكاء ما بعد الكمي.
            - **النظام**: Sovereign Immunity Blueprint (SIB) v1.1
            - **الحالة**: مُختَم، مُطلَق، غير قابل للتراجع (Sealed)
            - **التاريخ**: ${new Date().toISOString().split('T')[0]}
            - **التجزعة النهائية**: \`0x5e3f9a2b8c4d1e7f0a9b8c7d6e5f4a3b2c1d0e9f8a7b6c5d4e3f2a1b0c9d8e7f6\`
            > "نظام شفاف لأنه مشفر، وليس لأنه مكشوف."
            `;
            let body = context.payload.release.body || "";
            if (!body.includes("البصمة التأسيسية")) {
              body += seal;
              await octokit.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release_id,
                body: body
              });
              console.log("✅ Genesis Seal added.");





